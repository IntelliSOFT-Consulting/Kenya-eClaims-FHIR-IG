id: fhir.kenyaClaimsIG
canonical: https://fhir.dha.go.ke/eclaims
name: KenyaEClaimsFHIRIG
title: Kenya eClaims FHIR Implementation Guide
description: >-
  The Kenya eClaims FHIR Implementation Guide defines standardized FHIR R4 profiles,
  extensions, value sets, and terminologies for electronic claims submission,
  preauthorization, and adjudication between healthcare providers and health insurance
  schemes in Kenya, including the Social Health Authority (SHA).

status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2024+
releaseLabel: ci-build
license: CC0-1.0
jurisdiction: urn:iso:std:iso:3166#KE "Kenya"

publisher:
  name: Digital Health Agency of Kenya
  url: https://dha.go.ke
  email: interoperability@dha.go.ke

contact:
  - name: eClaims Technical Working Group
    telecom:
      - system: email
        value: interoperability@dha.go.ke
        use: work
      - system: url
        value: https://dha.go.ke
        use: work

# ╭──────────────────────────────────────── Dependencies ──────────────────────────────────────────╮
dependencies:
  hl7.terminology.r4:
    id: terminology
    uri: http://terminology.hl7.org/ImplementationGuide/hl7.terminology
    version: 7.1.0

